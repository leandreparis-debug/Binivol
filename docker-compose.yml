# Local stack: the application and a standard PostgreSQL 16.
# The database is not wired yet (it will be at step 2); it is provided so the
# stack is complete and portable from day one.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Binivol}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENABLE_DESIGN_PAGE: ${ENABLE_DESIGN_PAGE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binivol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-binivol}
    volumes:
      - binivol-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-binivol} -d ${POSTGRES_DB:-binivol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  binivol-db:
