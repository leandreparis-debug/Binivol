# Local stack: the application, PostgreSQL 16 for development, and a
# throw-away PostgreSQL for the integration tests (pnpm test:db).
# Standard PostgreSQL only: the same images run on a VPS.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Binivol}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENABLE_DESIGN_PAGE: ${ENABLE_DESIGN_PAGE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-binivol}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-binivol}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binivol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-binivol}
    ports:
      # Published on localhost only, for `pnpm db:migrate` / `db:seed` from the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - binivol-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-binivol} -d ${POSTGRES_DB:-binivol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-test:
    image: postgres:16
    environment:
      # Test-only credentials: this database holds nothing but test fixtures
      # and is wiped on every run (tmpfs, no volume).
      POSTGRES_USER: binivol
      POSTGRES_PASSWORD: binivol
      POSTGRES_DB: binivol_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binivol -d binivol_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  binivol-db:
